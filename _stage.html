<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --orange:#FF5722; --orange-lt:#FF8A50; --gold:#F9A825; --ink:#14100C; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:720px;overflow:hidden;
    font-family:'Nunito',system-ui,sans-serif;background:var(--ink);color:#fff}

  /* ambient background */
  .bg{position:absolute;inset:0;
    background:
      radial-gradient(110% 80% at 76% 18%, rgba(255,87,34,.34) 0%, transparent 58%),
      radial-gradient(80% 70% at 6% 92%, rgba(249,168,37,.20) 0%, transparent 62%),
      linear-gradient(160deg,#241B13 0%, #14100C 56%, #0A0705 100%);}
  .grain{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:3px 3px}
  .orb{position:absolute;border-radius:50%;filter:blur(40px);pointer-events:none}
  .orb1{width:620px;height:620px;right:-160px;top:-220px;background:rgba(255,87,34,.30)}
  .orb2{width:460px;height:460px;left:-140px;bottom:-190px;background:rgba(249,168,37,.18)}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,34px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,-28px)}}

  .stage{position:relative;width:1280px;height:720px;display:grid;
    grid-template-columns:1fr 470px;align-items:center;padding:0 74px 0 84px;gap:40px}

  /* left copy */
  .copy{max-width:520px}
  .eyebrow{font-size:14px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;
    color:var(--orange-lt);opacity:0;transform:translateY(14px);
    transition:opacity .6s ease, transform .6s ease}
  .eyebrow.on{opacity:1;transform:none}
  h1{font-size:62px;font-weight:900;line-height:1.02;letter-spacing:-.025em;margin:16px 0 0}
  .line{display:block;opacity:0;transform:translateY(26px);
    transition:opacity .65s cubic-bezier(.2,.7,.3,1), transform .65s cubic-bezier(.2,.7,.3,1)}
  .line.on{opacity:1;transform:none}
  .line.hl{color:var(--orange)}
  .sub{font-size:21px;font-weight:700;color:#CDBAA9;margin-top:20px;line-height:1.45;
    opacity:0;transform:translateY(16px);transition:opacity .6s ease .1s, transform .6s ease .1s}
  .sub.on{opacity:1;transform:none}

  /* progress dots */
  .dots{display:flex;gap:9px;margin-top:38px;opacity:0;transition:opacity .5s ease}
  .dots.on{opacity:1}
  .dot{width:30px;height:4px;border-radius:99px;background:rgba(255,255,255,.2);transition:background .4s ease}
  .dot.act{background:var(--orange)}

  /* phone */
  .phone-wrap{position:relative;display:flex;justify-content:center;align-items:center;
    opacity:0;transform:translateY(30px) scale(.97);
    transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1)}
  .phone-wrap.on{opacity:1;transform:none}
  .halo{position:absolute;width:430px;height:430px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,87,34,.42), transparent 66%);filter:blur(34px)}
  .device{position:relative;width:328px;height:660px;background:#080605;border-radius:46px;
    padding:11px;box-shadow:0 50px 100px rgba(0,0,0,.72), 0 0 0 1px rgba(255,255,255,.12),
    inset 0 0 0 2px rgba(255,255,255,.05)}
  .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#FFF8F0;position:relative}
  .screen iframe{width:390px;height:844px;border:0;
    transform:scale(.7692);transform-origin:top left;display:block}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:112px;height:26px;background:#080605;border-radius:0 0 16px 16px;z-index:5}

  /* end card */
  .endcard{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;
    background:radial-gradient(100% 80% at 50% 40%, rgba(255,87,34,.24) 0%, transparent 62%), rgba(10,7,5,.965);
    opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:20}
  .endcard.on{opacity:1}
  .ec-logo{width:96px;height:96px;border-radius:26px;object-fit:cover;margin-bottom:20px;
    box-shadow:0 20px 50px rgba(255,87,34,.4)}
  .ec-name{font-size:46px;font-weight:900;letter-spacing:-.02em}
  .ec-name .o{color:var(--orange)}
  .ec-tag{font-size:22px;font-weight:700;color:#CDBAA9;margin-top:10px}
  .ec-price{margin-top:26px;display:inline-flex;align-items:center;gap:12px;
    background:var(--orange);color:#fff;font-size:20px;font-weight:900;
    padding:15px 32px;border-radius:14px;box-shadow:0 16px 40px rgba(255,87,34,.5)}
  .ec-url{margin-top:22px;font-size:19px;font-weight:900;color:#fff;letter-spacing:.02em}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="orb orb1"></div><div class="orb orb2"></div>

  <div class="stage">
    <div class="copy">
      <div class="eyebrow" id="eyebrow">Food Truck Rewards</div>
      <h1><span class="line" id="l1"></span><span class="line hl" id="l2"></span></h1>
      <div class="sub" id="sub"></div>
      <div class="dots" id="dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div>
      </div>
    </div>

    <div class="phone-wrap" id="phoneWrap">
      <div class="halo"></div>
      <div class="device">
        <div class="notch"></div>
        <div class="screen"><iframe id="app" src="/index.html"></iframe></div>
      </div>
    </div>
  </div>

  <div class="endcard" id="endcard">
    <img class="ec-logo" src="/logo.png" alt="">
    <div class="ec-name">FOOD TRUCK <span class="o">REWARDS</span></div>
    <div class="ec-tag">Turn every customer into a regular.</div>
    <div class="ec-price">$9.99/month · 30-day free trial</div>
    <div class="ec-url">foodtruckrewards.com</div>
  </div>

<script>
  // Driven by the recording script.
  window.setStep = function(i, l1, l2, sub){
    const a=document.getElementById('l1'), b=document.getElementById('l2'),
          s=document.getElementById('sub');
    [a,b,s].forEach(e=>e.classList.remove('on'));
    setTimeout(()=>{
      a.textContent=l1; b.textContent=l2||''; s.textContent=sub||'';
      a.classList.add('on');
      setTimeout(()=>b.classList.add('on'),110);
      setTimeout(()=>s.classList.add('on'),200);
    }, 260);
    document.querySelectorAll('#dots .dot').forEach((d,n)=>d.classList.toggle('act', n===i));
  };
  window.showChrome = function(){
    document.getElementById('eyebrow').classList.add('on');
    document.getElementById('phoneWrap').classList.add('on');
    document.getElementById('dots').classList.add('on');
  };
  window.showEnd = function(){ document.getElementById('endcard').classList.add('on'); };
</script>
</body>
</html>
