<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Install Food Truck Rewards</title>
<meta name="description" content="Install the Food Truck Rewards app — earn points and rewards at your favorite food trucks">
<meta name="theme-color" content="#FF5722">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Food Truck Rewards">
<!-- iOS uses this for the home-screen icon AND the zoom that plays on
     launch. Pointing it at the 192 gave iOS the small artwork, which
     then swapped for the 512 on the launch screen. One size, one image. -->
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#FFF8F0;color:#2D1B0E;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 40px}
  .hero{background:linear-gradient(160deg,#FF5722 0%,#FF6F3C 60%,#FF8A65 100%);width:100%;padding:48px 24px 36px;text-align:center;color:white;border-radius:0 0 32px 32px;box-shadow:0 6px 24px rgba(255,87,34,.3)}
  .app-icon{width:96px;height:96px;border-radius:24px;background:white;display:flex;align-items:center;justify-content:center;font-size:54px;margin:0 auto 18px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .hero h1{font-size:28px;font-weight:900;letter-spacing:.3px;margin-bottom:6px}
  .hero p{font-size:15px;opacity:.92;font-weight:600}
  .wrap{width:100%;max-width:440px;padding:0 24px;margin-top:-20px}
  .install-btn{width:100%;background:#FF5722;color:white;border:none;border-radius:18px;padding:20px;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 8px 24px rgba(255,87,34,.4);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s}
  .install-btn:active{transform:scale(.97)}
  .install-btn.secondary{background:#2D1B0E;box-shadow:0 6px 18px rgba(45,27,14,.3)}
  .steps{margin-top:24px;display:flex;flex-direction:column;gap:12px}
  .step{display:flex;align-items:center;gap:14px;background:white;border:1.5px solid rgba(180,120,60,.15);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(180,100,40,.07)}
  .step-num{width:34px;height:34px;border-radius:50%;background:#FF5722;color:white;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step-num.gold{background:#F9A825}
  .step-t{font-weight:800;font-size:15px;line-height:1.3}
  .step-s{font-size:13px;color:rgba(45,27,14,.55);margin-top:2px;line-height:1.4}
  .note{margin-top:20px;text-align:center;font-size:13px;color:rgba(45,27,14,.5);font-weight:600;line-height:1.6}
  .warn{background:#FFF3E0;border:1.5px solid #FFCC80;border-radius:14px;padding:14px;font-size:13px;color:#E65100;font-weight:700;line-height:1.5;text-align:center;margin-bottom:4px}
  .benefits{margin-top:28px;display:flex;flex-direction:column;gap:10px}
  .benefit{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:#2D1B0E}
  .benefit .b-ico{font-size:22px}
  .hidden{display:none!important}
  .copy-btn{width:100%;background:#2D1B0E;color:white;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:4px}
  a.applink{display:block;text-align:center;margin-top:18px;color:#FF5722;font-weight:800;font-size:15px;text-decoration:none}
</style>
</head>
<body>
  <div class="hero">
    <div class="app-icon">🔥</div>
    <h1>Food Truck Rewards</h1>
    <p>Earn points &amp; rewards at your favorite food trucks 🌮</p>
  </div>

  <div class="wrap">
    <!-- Primary action area — filled in by JS per platform -->
    <div id="action"></div>

    <div class="benefits">
      <div class="benefit"><span class="b-ico">⭐</span> Earn points every visit</div>
      <div class="benefit"><span class="b-ico">🎁</span> Redeem free food &amp; rewards</div>
      <div class="benefit"><span class="b-ico">🎰</span> Spin the wheel for bonus prizes</div>
      <div class="benefit"><span class="b-ico">📍</span> See where your favorite trucks are parked</div>
    </div>

    <a class="applink" href="/app">Just open the app in browser →</a>
  </div>

<script>
  var APP_URL = location.origin + '/app';

  // Register service worker so Android Chrome considers the app installable
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(){});
  }

  // Capture the Android install prompt as early as possible
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    var btn = document.getElementById('android-install-btn');
    if (btn) { btn.disabled = false; btn.textContent = '⬇️  Install App'; }
  });

  window.addEventListener('appinstalled', function(){
    renderInstalled();
  });

  var ua = navigator.userAgent;
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  var isAndroid = /android/i.test(ua);
  var isRealSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA|FBAN|FBAV|Instagram|Line|musical_ly|Snapchat/i.test(ua);
  // Facebook, Instagram, Messenger etc. open links in their own WebView. On
  // Android that WebView NEVER fires beforeinstallprompt, so an Install button
  // there is a lie — you have to get out to Chrome first.
  var isInApp = /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|Line|musical_ly|Snapchat|Twitter|LinkedInApp|Pinterest/i.test(ua);
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

  var action = document.getElementById('action');

  function renderInstalled(){
    action.innerHTML =
      '<div class="step" style="border-color:#C5E1A5;background:#F1F8E9">' +
        '<div class="step-num" style="background:#2E7D32">✓</div>' +
        '<div><div class="step-t">App installed!</div>' +
        '<div class="step-s">Find the Food Truck Rewards icon on your home screen.</div></div></div>' +
      '<a class="applink" href="/app" style="margin-top:18px">Open Food Truck Rewards now →</a>';
  }

  /* Android + in-app browser: one tap reopens this exact page in Chrome via an
     intent:// URL, where the real install prompt works. browser_fallback_url
     covers phones without Chrome. */
  function renderAndroidInApp(){
    var here = location.origin + '/install';
    var intent = 'intent://' + location.host + '/install' +
                 '#Intent;scheme=https;package=com.android.chrome;' +
                 'S.browser_fallback_url=' + encodeURIComponent(here) + ';end';
    action.innerHTML =
      '<div class="warn">You opened this inside Facebook. Android only lets apps install from <strong>Chrome</strong>.</div>' +
      '<a class="install-btn" id="to-chrome" href="' + intent + '" ' +
        'style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:14px">' +
        '\u27A1\uFE0F  Open in Chrome to install</a>' +
      '<div class="steps" id="chrome-manual" style="margin-top:16px">' +
        '<div class="step"><div class="step-num">1</div><div><div class="step-t">Tap the button above</div>' +
        '<div class="step-s">It reopens this page in Chrome</div></div></div>' +
        '<div class="step"><div class="step-num gold">2</div><div><div class="step-t">Tap &quot;Install App&quot; there</div>' +
        '<div class="step-s">Chrome shows the real install pop-up</div></div></div>' +
      '</div>';
    // If the intent doesn't fire (some devices block it), say what to do by hand.
    var btn = document.getElementById('to-chrome');
    if (btn) btn.addEventListener('click', function(){
      setTimeout(function(){
        if (document.visibilityState === 'visible'){
          document.getElementById('chrome-manual').innerHTML =
            '<div class="warn">Still here? Tap the <strong>\u22EE</strong> menu in the top-right of ' +
            'this Facebook window and choose <strong>Open in browser</strong> \u2014 then tap Install.</div>';
        }
      }, 1200);
    });
  }

  function renderAndroid(){
    action.innerHTML =
      '<button class="install-btn" id="android-install-btn" onclick="androidInstall()">⬇️  Install App</button>' +
      '<div class="steps" id="android-manual" style="margin-top:16px"></div>';
  }

  window.androidInstall = function(){
    if (deferredPrompt){
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(r){
        if (r && r.outcome === 'accepted') renderInstalled();
        deferredPrompt = null;
      });
    } else {
      // Prompt not available yet — show manual Chrome menu steps
      document.getElementById('android-manual').innerHTML =
        '<div class="warn">Tip: tap the ⋮ menu (top-right) then "Install app" or "Add to Home screen".</div>' +
        '<div class="step"><div class="step-num">1</div><div><div class="step-t">Tap the ⋮ menu</div>' +
        '<div class="step-s">Top-right corner of Chrome</div></div></div>' +
        '<div class="step"><div class="step-num">2</div><div><div class="step-t">Tap "Install app"</div>' +
        '<div class="step-s">Or "Add to Home screen" — then Install</div></div></div>';
    }
  };

  function renderIOSSafari(){
    action.innerHTML =
      '<div class="steps">' +
        '<div class="warn">Tap <strong>Share</strong> then <strong>Add to Home Screen</strong> to install 👇</div>' +
        '<div class="step"><div class="step-num">1</div><div><div class="step-t">Tap the Share button ⬆️</div>' +
        '<div class="step-s">The box with an arrow at the bottom of Safari</div></div></div>' +
        '<div class="step"><div class="step-num gold">2</div><div><div class="step-t">Tap "Add to Home Screen"</div>' +
        '<div class="step-s">Scroll down in the menu, then tap Add</div></div></div>' +
      '</div>';
  }

  function renderIOSOther(){
    action.innerHTML =
      '<div class="warn">On iPhone, apps install only from <strong>Safari</strong> — not Chrome or in-app browsers (Apple’s rule).</div>' +
      '<button class="copy-btn" onclick="copyLink(this)" style="margin-top:12px">🔗 Copy App Link</button>' +
      '<div class="steps">' +
        '<div class="step"><div class="step-num">1</div><div><div class="step-t">Copy the link, then open Safari</div>' +
        '<div class="step-s">The blue compass icon on your phone</div></div></div>' +
        '<div class="step"><div class="step-num">2</div><div><div class="step-t">Paste the link &amp; go</div>' +
        '<div class="step-s">Tap Safari’s address bar, paste, press Go</div></div></div>' +
        '<div class="step"><div class="step-num gold">3</div><div><div class="step-t">Share ⬆️ → "Add to Home Screen"</div>' +
        '<div class="step-s">In Safari, tap Share then Add to Home Screen</div></div></div>' +
      '</div>';
  }

  function renderDesktop(){
    action.innerHTML =
      '<div class="warn">📱 Open this page on your phone to install the app.</div>' +
      '<div class="step" style="margin-top:12px"><div class="step-num">1</div><div><div class="step-t">Scan the QR code or open this link on your phone</div>' +
      '<div class="step-s">' + APP_URL.replace('/app','/install') + '</div></div></div>' +
      '<a class="applink" href="/app" style="margin-top:18px">Or use the web app here →</a>';
  }

  window.copyLink = function(btn){
    var done = function(){ btn.textContent = '✅ Copied! Now open Safari'; };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(APP_URL).then(done).catch(function(){ fallbackCopy(APP_URL, done); });
    } else { fallbackCopy(APP_URL, done); }
  };
  function fallbackCopy(text, cb){
    try{ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); cb(); }catch(e){}
  }

  // Decide what to show
  if (isStandalone) {
    renderInstalled();
  } else if (isAndroid && isInApp) {
    renderAndroidInApp();
  } else if (isAndroid) {
    renderAndroid();
  } else if (isIOS && isRealSafari) {
    renderIOSSafari();
  } else if (isIOS) {
    renderIOSOther();
  } else {
    renderDesktop();
  }
</script>
</body>
</html>
